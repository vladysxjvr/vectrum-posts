<!doctype html>
<!-- v2 test version: "how it works" page with real platform screens on demo data (names, companies and plates are made up).
     Served by server.js at /how-it-works; standalone, in the look of the landing (Inter, #070A12, accent #4D76F7, star sky). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Как работает Vectrum Space</title>
<link rel="icon" href="/brand/v3/icon-32.png">
<style>
  @font-face{font-family:Inter;font-weight:400 900;font-display:swap;src:url(/fonts/inter/inter-v20-0.woff2)format("woff2");unicode-range:U+460-52F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
  @font-face{font-family:Inter;font-weight:400 900;font-display:swap;src:url(/fonts/inter/inter-v20-1.woff2)format("woff2");unicode-range:U+301,U+400-45F,U+490-491,U+4B0-4B1,U+2116}
  @font-face{font-family:Inter;font-weight:400 900;font-display:swap;src:url(/fonts/inter/inter-v20-5.woff2)format("woff2");unicode-range:U+100-2BA,U+2BD-2C5,U+2C7-2CC,U+2CE-2D7,U+2DD-2FF,U+304,U+308,U+329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:Inter;font-weight:400 900;font-display:swap;src:url(/fonts/inter/inter-v20-6.woff2)format("woff2");unicode-range:U+??,U+131,U+152-153,U+2BB-2BC,U+2C6,U+2DA,U+2DC,U+304,U+308,U+329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  :root { --acc: #4D76F7; --line: rgba(77,118,247,.125); --card: rgba(18,22,37,.8); --txt: #F5F6FB; --muted: #B2B7C6; --dim: #7E869B; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; min-height: 100vh; color: var(--txt); font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(circle at 34% 5%, rgba(255,122,50,.12), transparent 25%), radial-gradient(circle at 72% 2%, rgba(83,104,255,.18), transparent 26%), #070A12; }
  a { color: inherit; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; width: min(1200px, calc(100% - 40px)); margin: 0 auto; }

  header { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: rgba(7,10,18,.72); border-bottom: 1px solid rgba(255,255,255,.06); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .logo img { width: 32px; height: 32px; object-fit: contain; }
  .nav { display: flex; align-items: center; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent;
    background: var(--acc); color: #fff; font: 600 13px/1 Inter, sans-serif; text-decoration: none; white-space: nowrap; transition: filter .2s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: rgba(18,22,37,.8); border-color: #2B3559; }
  .btn svg { width: 15px; height: 15px; }

  .hero { padding: 88px 0 40px; text-align: center; }
  .eyebrow { display: block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--acc); }
  h1 { margin: 16px 0 0; font-size: clamp(34px, 5vw, 56px); line-height: 1.1; font-weight: 700; }
  h1 em, h2 em { font-style: normal; color: var(--acc); }
  .lead { margin: 20px auto 0; max-width: 680px; font-size: 18px; line-height: 1.65; color: var(--muted); }
  .toc { margin: 36px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .toc a { padding: 8px 14px; border-radius: 20px; font-size: 13px; text-decoration: none; color: #C9D3F5; background: rgba(77,118,247,.06); border: 1px solid rgba(77,118,247,.2); }
  .toc a:hover { border-color: rgba(77,118,247,.5); }
  .note { margin: 22px auto 0; font-size: 12px; color: var(--dim); }

  /* the screens are wide (2.1:1) and dense: full width under the text, otherwise they are unreadable */
  .step { padding: 72px 0 24px; scroll-margin-top: 80px; }
  .copy { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 64px; align-items: start; margin-bottom: 32px; }
  .copy .body p { margin-top: 30px; }
  .num { font-size: 13px; font-weight: 700; color: var(--acc); }
  .tag { margin-left: 10px; padding: 4px 9px; border-radius: 20px; font-size: 11px; color: #9AB4FC; background: rgba(77,118,247,.06); border: 1px solid rgba(77,118,247,.2); vertical-align: 1px; }
  h2 { margin: 14px 0 0; font-size: 32px; line-height: 1.2; font-weight: 700; }
  .copy p { margin: 16px 0 0; font-size: 16px; line-height: 1.7; color: var(--muted); }
  .copy ul { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 12px; }
  .copy li { display: flex; gap: 12px; font-size: 15px; line-height: 1.5; color: #D6DBEA; }
  .copy li svg { flex: none; width: 18px; height: 18px; margin-top: 2px; color: var(--acc); }
  .shot { display: block; margin: 0; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 30px 80px -30px rgba(40,70,200,.45), 0 0 0 1px rgba(255,255,255,.02); cursor: zoom-in; }
  .shot .bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.02); }
  .shot .bar i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .shot img { display: block; width: 100%; height: auto; aspect-ratio: 1568 / 733; }

  .cta { margin: 72px 0 0; padding: 56px 32px; text-align: center; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .cta h2 { margin: 0; }
  .cta p { margin: 14px auto 0; max-width: 560px; font-size: 16px; line-height: 1.65; color: var(--muted); }
  .cta .row { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  footer { padding: 48px 0 40px; font-size: 13px; color: var(--dim); text-align: center; }

  /* full-size screen on click */
  .zoom { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(4,6,12,.9); cursor: zoom-out; }
  .zoom.on { display: flex; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 10px; border: 1px solid var(--line); }

  @media (max-width: 1000px) {
    .step { padding: 48px 0 8px; }
    .copy { grid-template-columns: 1fr; gap: 0; margin-bottom: 24px; }
    .copy .body p { margin-top: 16px; }
  }
  @media (max-width: 640px) {
    header .wrap { min-height: 60px; }
    .nav .ghost { display: none; }
    .logo { font-size: 15px; } .logo img { width: 28px; height: 28px; }
    .nav .btn { padding: 0 14px; }
    .hero { padding: 56px 0 24px; }
    .lead { font-size: 16px; }
    h2 { font-size: 26px; }
    .cta { padding: 40px 20px; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header><div class="wrap">
  <a class="logo" href="/"><img src="/brand/v3/mark.png" alt="">Vectrum Space</a>
  <nav class="nav"><a class="btn ghost" href="/" data-t="back"></a><a class="btn" href="https://dashboard.vectrumspace.eu/register" data-t="start"></a></nav>
</div></header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow" data-t="eyebrow"></span>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <nav class="toc" id="toc"></nav>
    <p class="note" data-t="note"></p>
  </section>
  <div id="steps"></div>
  <section class="cta">
    <h2 data-t="ctaTitle"></h2>
    <p data-t="ctaLead"></p>
    <div class="row"><a class="btn" href="https://dashboard.vectrumspace.eu/register" data-t="start"></a><a class="btn ghost" href="mailto:sales@vectrumspace.eu?subject=Demo%20Vectrum%20Space" data-t="demo"></a></div>
  </section>
</main>
<footer><div class="wrap">© 2026 Vectrum Space · sales@vectrumspace.eu</div></footer>
<div class="zoom" id="zoom"><img alt=""></div>

<script>
(function () {
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const back = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const T = {
    ru: {
      doc: 'Как работает Vectrum Space', back: back + 'На главную', start: 'Начать бесплатно' + arrow, demo: 'Записаться на демо',
      eyebrow: 'Как это работает', title: 'Vectrum <em>изнутри.</em>',
      lead: 'Настоящие экраны платформы. Так выглядит рабочий день логиста, механика и владельца: от заказа и карты до сервиса и цифр компании.',
      note: 'Экраны сняты на демо-данных: имена, компании и номера машин выдуманы.',
      ctaTitle: 'Хотите увидеть на своих данных?', ctaLead: 'Покажем Vectrum на примере вашего автопарка и поможем перенести машины, водителей и клиентов.',
      steps: [
        ['tracking', 'Трекинг', 'Вся перевозка <em>на одной карте</em>', 'Заказы слева, машины и маршрут на карте справа. Выбираете заказ и видите, где машина, сколько осталось ехать и кто за рулём.',
          ['Маршрут и расстояние с учётом грузовых ограничений', 'Статусы заказов: в пути, загрузка, задержка', 'Чат и звонок водителю прямо из карточки заказа']],
        ['orders', 'Заказы TMS', 'Что требует внимания <em>сегодня</em>', 'Сводка показывает, сколько перевозок в работе, какие задерживаются и какие ждут назначения. Блок «Требуют внимания» подсказывает, с чего начать день.',
          ['Просроченные доставки и устаревшая телеметрия', 'Последние перевозки с клиентом и статусом', 'ИИ-импорт заказа вместо ручного ввода']],
        ['planning', 'Планирование', 'Неделя автопарка <em>в одном календаре</em>', 'По строкам машины и водители, по столбцам дни. Сразу видно, кто свободен, где конфликт расписания и какие заказы остались без машины.',
          ['Вид на неделю, месяц или списком', 'Очередь заказов без машины или времени', 'Счётчики: требуют назначения, задерживаются, конфликты']],
        ['fleet', 'Флот', 'Карточка <em>каждой машины</em>', 'Состояние всего флота: статус, текущий рейс, груз и полуприцеп. В карточке машины назначенный водитель, ответственный диспетчер, документы и расчёты.',
          ['Фильтры: активные, в сервисе, неисправные', 'Документы и расчёты по машине', 'Звонок водителю из карточки']],
        ['maintenance', 'Обслуживание', 'Сервис, о котором <em>не нужно помнить</em>', 'Техосмотр, страховка и плановое обслуживание по каждой машине. Критичные сроки подсвечены красным, а сервисная задача создаётся прямо из предупреждения.',
          ['Очередь сервиса и ближайшие сроки', 'Коды диагностики (DTC)', 'Сервисная задача в один клик']],
        ['analytics', 'Аналитика', 'Цифры компании <em>без Excel</em>', 'Сколько машин в рейсе, свободно и на сервисе, сколько заказов открыто и закрыто. Финансовый обзор показывает фрахт и маржу по каждой машине за любой период.',
          ['Операционные показатели по всему автопарку', 'Фрахт и маржа по машинам', 'Экспорт в CSV и финансовые отчёты']],
      ],
    },
    en: {
      doc: 'How Vectrum Space works', back: back + 'Home', start: 'Start for free' + arrow, demo: 'Book a demo',
      eyebrow: 'How it works', title: 'Vectrum <em>from the inside.</em>',
      lead: 'Real screens of the platform. This is a working day of a dispatcher, a mechanic and an owner: from the order and the map to service and company numbers.',
      note: 'Screens are taken on demo data: names, companies and plates are made up.',
      ctaTitle: 'Want to see it with your data?', ctaLead: 'We will show Vectrum on your own fleet and help you move vehicles, drivers and customers.',
      steps: [
        ['tracking', 'Tracking', 'The whole trip <em>on one map</em>', 'Orders on the left, trucks and the route on the map. Pick an order and see where the truck is, how far it still goes and who is driving.',
          ['Route and distance with truck restrictions', 'Order status: on the road, loading, delayed', 'Chat and call the driver from the order card']],
        ['orders', 'TMS orders', 'What needs attention <em>today</em>', 'The overview shows how many trips are running, which are late and which wait for a truck. “Needs attention” tells you where to start the day.',
          ['Late deliveries and stale telemetry', 'Latest trips with customer and status', 'AI order import instead of typing']],
        ['planning', 'Planning', 'The fleet’s week <em>in one calendar</em>', 'Rows are trucks and drivers, columns are days. You see who is free, where the schedule clashes and which orders have no truck yet.',
          ['Week, month or list view', 'Queue of orders without a truck or time', 'Counters: to assign, delayed, conflicts']],
        ['fleet', 'Fleet', 'A card for <em>every vehicle</em>', 'The state of the whole fleet: status, current trip, cargo and trailer. The vehicle card holds the driver, the dispatcher, documents and costs.',
          ['Filters: active, in service, faulty', 'Documents and costs per vehicle', 'Call the driver from the card']],
        ['maintenance', 'Maintenance', 'Service you <em>don’t have to remember</em>', 'Inspection, insurance and planned service for every vehicle. Critical dates are red, and a service task is created right from the alert.',
          ['Service queue and upcoming dates', 'Diagnostic trouble codes (DTC)', 'Service task in one click']],
        ['analytics', 'Analytics', 'Company numbers <em>without Excel</em>', 'How many trucks are on the road, free and in service, how many orders are open and closed. The finance overview shows freight and margin per vehicle.',
          ['Operating figures for the whole fleet', 'Freight and margin per vehicle', 'CSV export and finance reports']],
      ],
    },
  };
  // language: the landing keeps it in localStorage "vectrum.language" (auto / ru / en / ...)
  let pick = 'auto'; try { pick = localStorage.getItem('vectrum.language') || 'auto'; } catch (e) {}
  if (pick === 'auto') pick = (navigator.language || 'en').slice(0, 2);
  const lang = /^(ru|uk)$/.test(pick) ? 'ru' : 'en', t = T[lang];
  document.documentElement.lang = lang; document.title = t.doc;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById('toc').innerHTML = t.steps.map(([id, tag]) => `<a href="#${id}">${tag}</a>`).join('');
  document.getElementById('steps').innerHTML = t.steps.map(([id, tag, h, p, li], i) => `
    <section class="step" id="${id}">
      <div class="copy"><div><span class="num">0${i + 1}</span><span class="tag">${tag}</span><h2>${h}</h2></div>
        <div class="body"><p>${p}</p><ul>${li.map(x => `<li>${check}<span>${x}</span></li>`).join('')}</ul></div></div>
      <figure class="shot" data-src="/__demo/how/${id}.jpg"><div class="bar"><i></i><i></i><i></i></div>
        <img src="/__demo/how/${id}.jpg" alt="${tag}" width="1568" height="733" loading="${i < 2 ? 'eager' : 'lazy'}"></figure>
    </section>`).join('');

  const zoom = document.getElementById('zoom');
  document.addEventListener('click', e => {
    const f = e.target.closest('.shot');
    if (f) { zoom.querySelector('img').src = f.dataset.src; zoom.classList.add('on'); }
    else if (e.target.closest('#zoom')) zoom.classList.remove('on');
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') zoom.classList.remove('on'); });

  // star sky like the landing (demo/stars.js): small blue stars twinkling on their own rhythm
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d'), C = [[96,165,250],[111,127,255],[77,118,247]];
  let stars = [], W = 0, H = 0, dpr = 1;
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const n = Math.round(W * H * 230 / (1080 * 1080) * (W < 800 ? .6 : 1));
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() < .1 ? 1.5 + Math.random() * .8 : .6 + Math.random() * .9,
      c: C[Math.floor(Math.random() * 3)], p: 3 + Math.random() * 6, ph: Math.random(), s: 1.5 + Math.random() * 2.5, b: Math.random() < .25 ? .25 : 0 }));
  }
  function frame(now) {
    const t = now / 1000; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = .75 * (s.b + (1 - s.b) * Math.pow(.5 + .5 * Math.sin(2 * Math.PI * (t / s.p + s.ph)), s.s)); if (a < .01) continue;
      ctx.fillStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a.toFixed(3)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
